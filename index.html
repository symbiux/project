<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Attendance &amp; Salary Management</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">HR</span>
      <div>
        <div class="brand-title">Attendance &amp; Salary</div>
        <div class="brand-sub" id="brandCompany">Company Name</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="employees">Employee Management</button>
      <button class="nav-item" data-view="attendance">Attendance</button>
      <button class="nav-item" data-view="corrections">Attendance Corrections</button>
      <button class="nav-item" data-view="reconciliation">Joining Date Reconciliation</button>
      <button class="nav-item" data-view="holidays">Holiday &amp; Weekly Off</button>
      <button class="nav-item" data-view="salary">Salary Processing</button>
      <button class="nav-item" data-view="reports">Reports</button>
      <button class="nav-item" data-view="settings">Settings</button>
    </nav>
    <div class="sidebar-foot">
      <div class="muted small">Signed in as</div>
      <div id="brandUser" class="small strong">HR Admin</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="viewTitle">Dashboard</h1>
      <div class="topbar-actions">
        <span class="pill" id="cyclePill">—</span>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Details</h3>
      <button class="btn ghost" id="modalClose">Close</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Libraries (bundled locally, no network required at runtime) -->
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="vendor/jszip.min.js"></script>

<!-- Application modules -->
<script src="storage.js"></script>
<script src="attendance.js"></script>
<script src="salary.js"></script>
<script src="reports.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
